<meta charset="utf-8">
<!-- ═══ CSP ═══
     نصّ المزوّد يمرّ إلى الواجهة (prose وnotes ورسائل الخطأ التي
     تحمل ١٨٠ حرفاً من جسم ردّه)، والمفتاح مخزَّنٌ في نفس الأصل.
     سطحُ الحقن مغلقٌ في الشفرة، وهذه طبقةٌ ثانية بلا تكلفة:
     لا سكربت مضمَّن في المشروع كلّه.
     style-src بلا 'unsafe-inline': لا سمةَ style ولا عنصرَ <style>
     في الصفحة ولا في قوالب الواجهة (تُحمَل الأنماط من css/*.css؛ واللونُ
     الآتي من البيانات يُطبَّق عبر CSSOM بعد الإدراج، وهو مسموح) ·
     connect-src مضيّقٌ إلى https وlocalhost لأن عنوان
     المزوّد يختاره المستخدم لكن لا داعي لقبول أي مخطّط أو مضيفٍ
     بعيد غير مشفّر · data: blob: لأن PNG يُدرَج صورةً في PDF
     ويُنزَّل بـblob.
     ═══ D0-02/D0-03/D0-08 — frame-ancestors هنا زائدةٌ عملياً ═══
     المتصفّحات تتجاهل frame-ancestors داخل <meta> (توجيهٌ يُقبَل من
     رأس HTTP فقط، لا من عنصر meta — قيد المواصفة لا عطلٌ هنا).
     الحمايةُ الفعليةُ من رأس Content-Security-Policy في _headers
     وnetlify.toml وserving/static-server.js، والثلاثةُ تحمل
     frame-ancestors 'none' فعلاً. أبقيتُ التوجيه هنا موثّقاً لا
     فعّالاً (توافقاً مع csp.test.js وphase3.3.test.js اللذين
     يشترطانه في نصّ الـmeta) بدل حذفه وتعديل الاختبارين معاً. -->
<meta http-equiv="Content-Security-Policy" content="
 default-src 'self';
 script-src 'self';
 style-src 'self';
 img-src 'self' data: blob:;
 connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
 object-src 'none';
 base-uri 'none';
 form-action 'none';
 frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivilDraft — مخططات معمارية</title>
<link rel="manifest" href="manifest.json">

<!-- ═══ الأيقونات — مسارات نسبية كبقية الملفات، وكلّها من نفس الأصل
     فيكفيها img-src 'self' القائم دون أي تعديل على الـCSP.
     ICO احتياطٌ للمتصفحات القديمة (sizes="32x32" كي لا يفضّله Chrome
     على الـSVG) · SVG للحديثة · apple-touch-icon لشاشة iOS الرئيسية
     (180×180 بلا شفافية). ═══ -->
